name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 先证明校验器自己是活的。
      # 一个只会说 OK 的校验器和没有校验器是一回事 —— 自检会往一份干净的 manifest 里
      # 逐条注入真实的坏值，任何一条注入没让它变红就直接失败。
      - name: 校验器自检
        run: python tools/validate_repo.py --selftest

      - name: 校验插件与索引
        run: python tools/validate_repo.py

      # 产物必须是当前源码的产物。registry.json 和 packages/*.ipk 都在版本库里，
      # 改完插件忘了跑 build.py 的话市场拿到的还是旧包，而且一切看起来都正常。
      #
      # 上一版这里是「重打一遍看有没有 diff」，前提是打包逐字节可复现。
      # 时间戳 / 文件顺序 / 权限位 / create_system 都能钉死，但 **deflate 压缩流跨
      # zlib 版本不保证一致**（实测 Windows 与本 runner 就不同），所以那个检查
      # 本地永远绿、CI 永远红，diff 里还只有一串哈希在变，看不出任何线索。
      #
      # 现在分两头查，都平台无关：
      #   - 包里的内容 == 源码：在 validate_repo 里逐文件比（能点名是哪个文件）
      #   - registry 的元数据是最新的：build.py --check（不写文件、不打包）
      - name: 检查 registry.json 是最新的
        run: python tools/build.py --check

      # 校验器只看 manifest 合不合规，看不出插件的逻辑对不对。
      # VOD 资源站那套解析（$$$ 多线路对齐、翻页边界、脏地址过滤、两种故障要报成
      # 两句不同的话）全是编译不出来的东西，只能拿夹具跑。
      - name: VOD 资源站行为测试
        run: node tools/test_vod.mjs

  pages:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 整个仓库就是站点：index.html 直接读同目录的 registry.json，没有构建步骤。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
