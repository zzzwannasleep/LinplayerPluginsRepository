<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Linplayer 插件市场</title>
    <link rel="icon" type="image/png" href="assets/icons/app_icon_transparent.png" />
    <link rel="stylesheet" href="assets/vendor/layui/css/layui.css" />
    <link rel="stylesheet" href="assets/vendor/animate/animate.min.css" />
    <link rel="stylesheet" href="assets/ui.css?v=2" />
  </head>
  <body>
    <!-- 加载动画 -->
    <div id="preloader">
      <img
        class="pl-logo animate__animated animate__pulse animate__infinite"
        src="assets/icons/app_icon_transparent.png"
        alt="Linplayer"
      />
      <div class="pl-bar"></div>
      <div class="pl-text" id="plText">正在加载插件市场…</div>
    </div>

    <!-- 主体（数据就绪后进入动画显示） -->
    <div id="app" class="is-hidden">
      <header class="topbar">
        <div class="topbar__inner">
          <div class="brand">
            <img class="brand__logo" src="assets/icons/app_icon_transparent.png" alt="" />
            <div>
              <div class="brand__title">Linplayer 插件市场</div>
              <div class="brand__sub">挑选插件，下载 .ipk，在 App 内安装</div>
            </div>
          </div>
          <nav class="nav">
            <a href="index.html" class="is-active">插件市场</a>
            <a href="guide.html">开发指南</a>
            <a href="spec.html">插件规范</a>
            <a
              href="https://github.com/zzzwannasleep/LinplayerPluginsRepository"
              target="_blank"
              rel="noreferrer"
              >GitHub</a
            >
          </nav>
        </div>
      </header>

      <main class="wrap">
        <div class="toolbar">
          <label class="search">
            <i class="ico layui-icon layui-icon-search"></i>
            <input id="q" placeholder="搜索插件：名称 / ID / 描述 / 标签" autocomplete="off" />
          </label>
          <div class="count">
            <b id="count">0</b> 个插件 · 更新于 <span id="updatedAt">-</span>
          </div>
        </div>

        <div id="warn" class="warn is-hidden"></div>

        <div class="layui-tab layui-tab-brief" lay-filter="marketTabs">
          <ul class="layui-tab-title">
            <li class="layui-this" lay-id="pc">PC 端</li>
            <li lay-id="mobile">移动端</li>
            <li lay-id="tv">TV 端</li>
          </ul>
          <div class="layui-tab-content">
            <div class="layui-tab-item layui-show"><div id="grid-pc" class="cardgrid"></div></div>
            <div class="layui-tab-item"><div id="grid-mobile" class="cardgrid"></div></div>
            <div class="layui-tab-item"><div id="grid-tv" class="cardgrid"></div></div>
          </div>
        </div>

        <div class="foot">
          <details>
            <summary>免责声明</summary>
            <p>
              本仓库插件由社区贡献，仅供学习交流。插件可能访问第三方站点并返回不稳定结果。
              请在合法合规前提下使用。维护者不对插件内容及由此带来的损失负责。
            </p>
          </details>
        </div>
      </main>
    </div>

    <noscript>
      <div style="padding: 24px; text-align: center">该页面需要启用 JavaScript 才能加载插件列表。</div>
    </noscript>

    <script src="assets/vendor/layui/layui.js"></script>
    <script type="module" src="assets/market.js?v=2"></script>
  </body>
</html>
