<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>LinPlayer 插件市场</title>
    <meta name="description" content="LinPlayer 的官方插件仓库：数据源、界面扩展、播放增强、通知与工具。" />
    <link rel="icon" type="image/png" href="assets/icons/app_icon_transparent.png" />
    <link rel="stylesheet" href="assets/ui.css?v=5" />
  </head>
  <body class="loading">
    <header class="top">
      <a class="brand" href="index.html">
        <img src="assets/icons/app_icon_transparent.png" alt="" />
        <span>LinPlayer <b>插件市场</b></span>
      </a>
      <nav>
        <a class="on" href="index.html">插件</a>
        <a href="guide.html">开发指南</a>
        <a href="spec.html">规范</a>
        <a href="https://github.com/zzzwannasleep/LinplayerPluginsRepository" target="_blank" rel="noreferrer">GitHub</a>
      </nav>
    </header>

    <main class="wrap">
      <div class="hero">
        <h1>插件</h1>
        <p>装上就用，随时停用。每个插件要什么权限，装之前就写在这儿。</p>
      </div>

      <input id="q" class="search" type="search" placeholder="搜插件：名称 / 用途 / 标签" autocomplete="off" />

      <div id="tabs" class="tabs"></div>

      <p id="warn" class="warn" hidden></p>

      <p class="count"><b id="count">0</b> 个插件</p>
      <div id="grid" class="grid"></div>

      <section class="foot">
        <h4>关于安全</h4>
        <p>
          插件跑在一个受限的 JS 引擎里：能做什么由清单里声明的权限决定，出网只允许访问清单
          列出的域名（空的就是完全不能出网）。安装包带 sha256 校验和，App 下载后逐字节核对。
          <b>不做代码签名</b> —— 校验和只能保证你拿到的和仓库里的是同一份，不代表内容被审计过。
        </p>
        <h4>免责声明</h4>
        <p>
          插件可能访问第三方站点并返回不稳定的结果。请在合法合规的前提下使用；维护者不对插件内容
          及由此带来的损失负责。
        </p>
      </section>
    </main>

    <dialog id="detail" class="dlg">
      <div class="dlg-hd">
        <h3 id="dTitle"></h3>
        <button id="dClose" class="x" aria-label="关闭">×</button>
      </div>
      <div id="dBody" class="dlg-bd"></div>
    </dialog>

    <noscript><p class="wrap">这一页需要 JavaScript 才能列出插件。</p></noscript>
    <script type="module" src="assets/market.js?v=5"></script>
  </body>
</html>
